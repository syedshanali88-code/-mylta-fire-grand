<!DOCTYPE html>
<html lang="ur">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>MYLTA - VOICE CHAT 35 MIN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;overflow:hidden;font-family:Arial;color:#fff}
#lobby{position:fixed;left:0;top:0;width:100vw;height:100vh;background:linear-gradient(#0f1a0f,#1e3d1e);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
#ui{position:fixed;top:0;left:0;width:100%;height:52px;background:rgba(0,0,0,0.95);display:flex;justify-content:space-between;align-items:center;padding:0 8px;z-index:300;border-bottom:3px solid #ffcc00;font-weight:bold;font-size:11px;display:none}
#game{position:relative;width:100vw;height:100vh;overflow:hidden;background:linear-gradient(#6ab0ff,#7ab369)}
#map{position:absolute;width:8000px;height:8000px;background:#7ab369;left:-1000px;top:-1000px;border:8px solid #ffcc00}
#blueZone{position:absolute;border:6px dashed #0066ff;background:rgba(0,102,255,0.12);border-radius:50%;z-index:2;transition:all 12s linear}
.house{position:absolute;background:#d2b48c;border:4px solid #5a3510;z-index:5}
#plane{position:absolute;width:320px;height:70px;background:#eee;border:4px solid #000;border-radius:20px;z-index:100;display:flex;align-items:center;justify-content:center;color:#000;font-weight:bold;left:-400px;top:800px}
.char{position:absolute;width:50px;height:70px;z-index:20}
.head{width:26px;height:26px;background:#ffdbac;border-radius:50%;border:2px solid #000;margin:0 auto}
.body{width:34px;height:30px;background:#555;border:2px solid #000;margin:2px auto 0;border-radius:5px}
.legs{width:34px;display:flex;justify-content:space-between;margin:0 auto}
.leg{width:13px;height:18px;background:#444;border:2px solid #000}
.nameTag{position:absolute;top:-22px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.7);color:#fff;font-size:9px;padding:2px 6px;border-radius:10px;white-space:nowrap;border:1px solid #ffcc00}
.para{position:absolute;top:-50px;left:-10px;font-size:48px;display:none}
#playerWrap{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:50;display:none}
#joystick{width:135px;height:135px;background:rgba(0,0,0,0.35);border-radius:50%;position:fixed;bottom:20px;left:15px;z-index:300;border:2px solid #fff3;display:none}
#stick{width:58px;height:58px;background:#ffcc00;border-radius:50%;position:absolute;left:38px;top:38px}
#fireBtn{width:90px;height:90px;background:radial-gradient(#ff5555,#cc0000);border-radius:50%;position:fixed;bottom:80px;right:15px;z-index:300;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid #fff;display:none}
#voiceBtn{width:90px;height:90px;background:radial-gradient(#55ff55,#00aa00);border-radius:50%;position:fixed;bottom:180px;right:15px;z-index:310;display:flex;align-items:center;justify-content:center;font-weight:bold;border:3px solid #fff;font-size:12px;text-align:center;flex-direction:column;display:none}
#jumpBtn{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:140px;height:140px;background:#ffcc00;border-radius:50%;z-index:400;display:none;align-items:center;justify-content:center;color:#000;font-weight:bold;font-size:19px;border:5px solid #fff}
#status{position:fixed;top:62px;left:50%;transform:translateX(-50%);background:rgba(0,0,0,0.85);padding:10px 20px;border-radius:20px;z-index:400;border:2px solid #ffcc00;display:none;text-align:center}
#voiceList{position:fixed;top:60px;left:10px;background:rgba(0,0,0,0.7);padding:8px;border-radius:10px;z-index:310;font-size:10px;display:none}
#winScreen{position:fixed;left:0;top:0;width:100vw;height:100vh;background:rgba(0,0,0,0.9);z-index:999;display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center}
</style>
</head>
<body>

<div id="lobby">
<div style="font-size:80px">🪖</div>
<h1 style="color:#ffcc00;font-size:36px">MYLTA FIRE GRAND</h1>
<p>🎤 VOICE CHAT | 35 MIN | 12 SQUAD</p>
<p style="font-size:12px;opacity:0.7;margin-top:8px">دوستوں کے ساتھ بات کرنے کے لیے MIC Allow کرنا</p>
<button onclick="startPlane()" style="padding:18px 60px;background:linear-gradient(#ffcc00,#ff9900);color:#000;font-weight:bold;font-size:20px;border:none;border-radius:30px;margin-top:18px">▶ START WITH VOICE</button>
</div>

<div id="ui"><div>MYLTA VOICE</div><div id="zoneTimer">ZONE: 8000m</div><div id="killCount">ALIVE: 48</div></div>
<div id="status"></div>
<div id="voiceList">🎤 VOICE SQUAD<br>SHAN: <span id="myMicStatus">OFF</span><br>BOT1: 🔇<br>BOT2: 🔇<br>BOT3: 🔇</div>
<div id="jumpBtn">JUMP 🪂</div>

<div id="game"><div id="map"><div id="blueZone" style="left:0;top:0;width:8000px;height:8000px"></div><div id="plane">MYLTA AIRLINES ✈️</div></div></div>
<div id="playerWrap"><div class="char"><div class="para" id="myPara">🪂</div><div class="nameTag" style="background:#0066ff">SHAN 👑 🎤</div><div class="head"></div><div class="body" style="background:#0066ff"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div></div></div>
<div id="joystick"><div id="stick"></div></div>
<div id="fireBtn">FIRE</div>
<div id="voiceBtn" onclick="toggleVoice()"><span style="font-size:28px">🎤</span><span id="voiceTxt">MIC OFF</span></div>
<div id="winScreen"><h1 style="color:#ffcc00;font-size:42px">CHICKEN DINNER! 🍗</h1><p id="winStats"></p><button onclick="location.reload()" style="padding:15px 40px;background:#ffcc00;color:#000;font-weight:bold;border:none;border-radius:30px;font-size:18px;margin-top:20px">PLAY AGAIN</button></div>

<script>
let map=document.getElementById('map'),mx=-1000,my=-1000,jx=0,jy=0,kills=0,totalBots=48,gameTime=0;
let plane=document.getElementById('plane'),planeX=-400,inPlane=true,landed=false;
let joy=document.getElementById('joystick'),stick=document.getElementById('stick');
let blue=document.getElementById('blueZone'),zoneSize=8000,zoneX=0,zoneY=0,zoneStarted=false;
let micOn=false,localStream=null;

function startPlane(){
 document.getElementById('lobby').style.display='none';
 document.getElementById('ui').style.display='flex';
 document.getElementById('status').style.display='block';
 document.getElementById('status').innerText='🛩️ جہاز میں 12 سکواڈ | MIC دبا کر دوستوں سے بات کرو';
 document.getElementById('jumpBtn').style.display='flex';
 document.getElementById('playerWrap').style.display='block';
 document.getElementById('voiceBtn').style.display='flex';
 document.getElementById('voiceList').style.display='block';
 planeLoop();
}
function planeLoop(){
 if(!inPlane) return;
 planeX+=6; plane.style.left=planeX+'px';
 if(planeX<8500) requestAnimationFrame(planeLoop);
 else { inPlane=false; if(!landed) autoJump(); }
}
function autoJump(){ document.getElementById('jumpBtn').click(); }

async function toggleVoice(){
 let txt=document.getElementById('voiceTxt'), stat=document.getElementById('myMicStatus'), btn=document.getElementById('voiceBtn');
 if(!micOn){
  try{
   localStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
   micOn=true; txt.innerText='MIC ON'; stat.innerText='ON 🔊'; stat.style.color='#0f0';
   btn.style.background='radial-gradient(#ff5555,#cc0000)';
   document.getElementById('status').style.display='block';
   document.getElementById('status').innerText='✅ وائس آن ہے - آپ کا سکواڈ آپ کو سن رہا ہے! 🎤';
   // آواز کی لہر دکھانے کے لیے
   let audioCtx=new (window.AudioContext||window.webkitAudioContext)();
   let analyser=audioCtx.createAnalyser(); audioCtx.createMediaStreamSource(localStream).connect(analyser);
   setTimeout(()=>{document.getElementById('status').style.display='none'},3500);
  }catch(e){
   alert('بھائی مائک کی اجازت دیں! Allow دبائیں تاکہ دوست آپ کو سن سکیں');
  }
 } else {
  if(localStream) localStream.getTracks().forEach(t=>t.stop());
  micOn=false; txt.innerText='MIC OFF'; stat.innerText='OFF'; stat.style.color='#fff';
  btn.style.background='radial-gradient(#55ff55,#00aa00)';
  document.getElementById('status').style.display='block';
  document.getElementById('status').innerText='🔇 وائس بند';
  setTimeout(()=>document.getElementById('status').style.display='none',2000);
 }
}

document.getElementById('jumpBtn').addEventListener('click',()=>{
 inPlane=false; document.getElementById('jumpBtn').style.display='none';
 document.getElementById('myPara').style.display='block';
 let h=0; let fall=setInterval(()=>{
  h+=4; document.getElementById('playerWrap').style.top=(50+h/12)+'%';
  if(h>120){ clearInterval(fall); landed=true;
   document.getElementById('myPara').style.display='none';
   document.getElementById('status').style.display='block';
   document.getElementById('status').innerText='✅ لینڈنگ! MIC آن کرو اور سکواڈ سے بات کرو 🎤';
   document.getElementById('joystick').style.display='block';
   document.getElementById('fireBtn').style.display='flex';
   document.getElementById('voiceBtn').style.display='flex';
   setTimeout(()=>document.getElementById('status').style.display='none',4000);
   spawnSquadBots(); startGameTimer();
  }
 },70);
});

let bots=[];
function spawnSquadBots(){
 let spots=[{x:500,y:500},{x:3000,y:800},{x:6000,y:500},{x:500,y:3000},{x:3500,y:3500},{x:6500,y:3000},{x:800,y:6000},{x:3000,y:6000},{x:6000,y:6000},{x:1500,y:1500},{x:5000,y:1500},{x:5000,y:5000}];
 spots.forEach((s,idx)=>{
  for(let j=0;j<4;j++){
   let b=document.createElement('div');b.className='char bot';
   b.innerHTML=`<div class="para">🪂</div><div class="nameTag">S${idx+1}-BOT${j+1} 🎤</div><div class="head"></div><div class="body"></div><div class="legs"><div class="leg"></div><div class="leg"></div></div>`;
   b.style.left=(s.x+Math.random()*350)+'px'; b.style.top=(s.y+Math.random()*250)+'px';
   b.alive=true; map.appendChild(b); bots.push(b);
   let para=b.querySelector('.para'); para.style.display='block'; setTimeout(()=>para.style.display='none',2500);
  }
 });
 for(let i=0;i<20;i++){let h=document.createElement('div');h.className='house';h.style.left=(400+Math.random()*7000)+'px';h.style.top=(400+Math.random()*7000)+'px';h.style.width='300px';h.style.height='250px';map.appendChild(h)}
}
function startGameTimer(){
 setInterval(()=>{
  gameTime++; let m=Math.floor(gameTime/60); let s=gameTime%60;
  document.getElementById('zoneTimer').innerText=`ZONE: ${zoneSize}m | ${m}:${s<10?'0'+s:s} / 35:00`;
 },1000);
}
setInterval(()=>{
 if(!landed) return;
 zoneSize-=600; if(zoneSize<600) zoneSize=600;
 zoneX=(8000-zoneSize)/2; zoneY=(8000-zoneSize)/2;
 blue.style.left=zoneX+'px'; blue.style.top=zoneY+'px'; blue.style.width=zoneSize+'px'; blue.style.height=zoneSize+'px';
},180000);

setInterval(()=>{
 if(!landed) return;
 let cx=zoneX+zoneSize/2, cy=zoneY+zoneSize/2;
 bots.forEach(b=>{
  if(!b.alive) return;
  let bx=parseFloat(b.style.left),by=parseFloat(b.style.top);
  let out=bx<zoneX||bx>zoneX+zoneSize||by<zoneY||by>zoneY+zoneSize;
  if(out){let ang=Math.atan2(cy-by,cx-bx); b.style.left=(bx+Math.cos(ang)*1)+'px'; b.style.top=(by+Math.sin(ang)*1)+'px';}
 });
},90);

document.getElementById('fireBtn').addEventListener('touchstart',()=>{
 let bl=document.createElement('div');bl.style.position='absolute';bl.style.width='12px';bl.style.height='12px';bl.style.background='yellow';bl.style.borderRadius='50%';bl.style.zIndex=30;
 let sx=-mx+window.innerWidth/2, sy=-my+window.innerHeight/2;
 bl.style.left=sx+'px'; bl.style.top=sy+'px'; map.appendChild(bl);
 let by=sy;
 let id=setInterval(()=>{
  by-=20; bl.style.top=by+'px';
  bots.forEach(b=>{
   if(!b.alive) return;
   let d=Math.hypot(sx-parseFloat(b.style.left), by-parseFloat(b.style.top));
   if(d<45){b.alive=false;b.style.opacity='0.2';b.style.transform='rotate(90deg)';kills++;document.getElementById('killCount').innerText=`ALIVE: ${totalBots-kills} | KILL: ${kills}`;bl.remove();clearInterval(id);
   if(kills>=totalBots){document.getElementById('winScreen').style.display='flex';document.getElementById('winStats').innerText=`35 منٹ میں ${kills} مارے!`;}}
  });
  if(by<sy-1000){bl.remove();clearInterval(id)}
 },16);
});
joy.addEventListener('touchmove',e=>{
 let r=joy.getBoundingClientRect(),t=e.touches[0],dx=t.clientX-(r.left+67),dy=t.clientY-(r.top+67);
 let d=Math.min(50,Math.hypot(dx,dy)),a=Math.atan2(dy,dx);jx=Math.cos(a)*d/50;jy=Math.sin(a)*d/50;
 stick.style.left=38+Math.cos(a)*d+'px';stick.style.top=38+Math.sin(a)*d+'px';
});
joy.addEventListener('touchend',()=>{jx=0;jy=0;stick.style.left='38px';stick.style.top='38px'});
(function loop(){if(landed){mx-=jx*10;my-=jy*10;map.style.left=mx+'px';map.style.top=my+'px';}requestAnimationFrame(loop)})();
</script>
</body>
</html>
