<!DOCTYPE html>
<html><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MYLTA FIRE GRAND</title>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}</script>
<style>*{margin:0;padding:0;box-sizing:border-box}body{background:#000;overflow:hidden;color:#fff;font-family:Arial}
#lobby{position:fixed;inset:0;z-index:200;background:linear-gradient(#1e3a5a,#0a1a2a);display:flex;flex-direction:column}
.mid{flex:1;display:flex;align-items:center;justify-content:center;gap:10px}
.pbox{width:105px;height:230px;background:#222;border:2px solid #555;border-radius:10px;display:flex;align-items:end;justify-content:center;padding-bottom:10px;font-size:11px;text-align:center}
.bot{height:120px;background:#000;display:flex;align-items:center;gap:20px;padding:10px}
#start{padding:15px 50px;background:#ffcc00;border:0;border-radius:6px;font-weight:bold;font-size:22px}
#load{position:fixed;inset:0;z-index:190;background:#001a33;display:none;flex-direction:column;align-items:center;justify-content:center}
#ui{position:fixed;inset:0;z-index:50;display:none}
.hud{position:absolute;top:0;left:0;width:100%;display:flex;justify-content:space-between;padding:6px 10px;background:rgba(0,0,0,0.5);font-size:12px}
.joy{position:absolute;left:10px;bottom:10px;width:115px;height:115px;background:rgba(255,255,255,0.15);border-radius:50%;border:2px solid rgba(255,255,255,0.3)}
.stick{position:absolute;left:32px;top:32px;width:52px;height:52px;background:#fff;border-radius:50%}
.btn{position:absolute;width:65px;height:65px;background:rgba(0,0,0,0.6);border:2px solid #fff;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px}
</style></head><body>
<div id="lobby"><div style="padding:10px;display:flex;justify-content:space-between"><span>SHAN GAMING</span><span>MYLTA GRAND</span></div><div class="mid"><div class="pbox" style="border-color:#ffcc00">YOU SHAN<br>READY</div><div class="pbox">PLAYER 2<br>READY</div><div class="pbox">PLAYER 3<br>READY</div></div><div class="bot"><div><div style="font-size:22px;font-weight:bold">00:09 Team 4/4</div><div style="font-size:11px">Ocean Palace - Final</div></div><button id="start" onclick="startGame()">START</button></div></div>
<div id="load"><div style="font-size:90px">🐋</div><h2 style="margin-top:10px">OCEAN PALACE</h2><div style="width:70%;height:6px;background:#222;margin-top:20px;border-radius:5px"><div id="bar" style="width:0%;height:100%;background:#00e5ff"></div></div><p id="pp" style="margin-top:10px">0%</p></div>
<div id="ui"><div class="hud"><span>Alive 100</span><span id="center">Match starts in 20</span><span>Mylta Power</span></div><div id="kill" style="position:absolute;left:10px;top:50px;color:#ffcc00;font-size:12px"></div><div class="joy" id="joy"><div class="stick" id="stick"></div></div><div class="btn" id="jmp" style="right:12px;bottom:150px">🚀</div><div class="btn" id="fire" style="right:12px;bottom:70px">🔫</div></div>
<script type="module">
import * as THREE from 'three';
let scene,camera,renderer,player,plane,state='lobby',jx=0,jy=0,t=20;
window.startGame=()=>{
 document.getElementById('lobby').style.display='none';
 document.getElementById('load').style.display='flex';
 let p=0; let iv=setInterval(()=>{p+=4;if(p>100)p=100;
 document.getElementById('bar').style.width=p+'%';document.getElementById('pp').innerText=p+'%';
 if(p>=100){clearInterval(iv);init3D();}},50);
}
function init3D(){
 document.getElementById('load').style.display='none';
 document.getElementById('ui').style.display='block';
 scene=new THREE.Scene();scene.background=new THREE.Color(0x8ec6e8);scene.fog=new THREE.Fog(0x8ec6e8,100,700);
 camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,0.1,1000);
 renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;
 document.body.appendChild(renderer.domElement);
 scene.add(new THREE.AmbientLight(0xffffff,0.9));
 let sun=new THREE.DirectionalLight(0xffffff,1);sun.position.set(80,150,60);sun.castShadow=true;scene.add(sun);
 let ground=new THREE.Mesh(new THREE.PlaneGeometry(4000,4000),new THREE.MeshStandardMaterial({color:0x7bb26a}));
 ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
 let water=new THREE.Mesh(new THREE.PlaneGeometry(700,700),new THREE.MeshStandardMaterial({color:0x2ec4b6,transparent:true,opacity:0.9}));
 water.rotation.x=-Math.PI/2;water.position.set(0,0.2,0);scene.add(water);
 for(let i=0;i<40;i++){let h=10+Math.random()*25;let b=new THREE.Mesh(new THREE.BoxGeometry(14,h,14),new THREE.MeshStandardMaterial({color:0x8d6e63}));b.position.set((Math.random()-0.5)*1000,h/2,(Math.random()-0.5)*1000);b.castShadow=true;scene.add(b);}
 for(let i=0;i<20;i++){let col=new THREE.Mesh(new THREE.CylinderGeometry(2,2.2,18,8),new THREE.MeshStandardMaterial({color:0xe0f2f1}));let ang=i/20*Math.PI*2;let r=70+i%2*35;col.position.set(Math.cos(ang)*r,9,Math.sin(ang)*r);col.castShadow=true;scene.add(col);}
 player=new THREE.Group();
 let body=new THREE.Mesh(new THREE.BoxGeometry(0.9,1.3,0.5),new THREE.MeshStandardMaterial({color:0x222}));body.position.y=1;body.castShadow=true;player.add(body);
 let head=new THREE.Mesh(new THREE.SphereGeometry(0.36,12,12),new THREE.MeshStandardMaterial({color:0xffd5b0}));head.position.y=2;player.add(head);
 let hel=new THREE.Mesh(new THREE.SphereGeometry(0.45,12,12,0,Math.PI*2,0,Math.PI/2*1.2),new THREE.MeshStandardMaterial({color:0x111}));hel.position.y=2.1;hel.rotation.x=Math.PI;player.add(hel);
 player.position.set(20,0.7,20);scene.add(player);
 let iv=setInterval(()=>{t--;document.getElementById('center').innerText='Match starts in '+t;if(t<=0){clearInterval(iv);goPlane();}},1000);
 setupControls();animate();
}
function goPlane(){
 state='plane';document.getElementById('center').innerText='In Plane - Press JUMP';
 plane=new THREE.Group();
 let fus=new THREE.Mesh(new THREE.BoxGeometry(6,5,45),new THREE.MeshStandardMaterial({color:0x111}));plane.add(fus);
 let wing=new THREE.Mesh(new THREE.BoxGeometry(42,1,10),new THREE.MeshStandardMaterial({color:0x111}));plane.add(wing);
 let manta=new THREE.Mesh(new THREE.SphereGeometry(10,12,8),new THREE.MeshStandardMaterial({color:0x00bfff,transparent:true,opacity:0.6}));manta.scale.set(2.3,0.35,1.1);manta.position.set(0,8,0);plane.add(manta);
 plane.position.set(0,150,400);scene.add(plane);plane.add(player);player.position.set(0,3,0);
}
function doJump(){if(state!='plane')return;plane.remove(player);scene.add(player);player.position.set(plane.position.x,plane.position.y-10,plane.position.z);scene.remove(plane);state='fall';document.getElementById('center').innerText='Skydiving - Ocean Palace';}
function setupControls(){
 let joy=document.getElementById('joy'),stick=document.getElementById('stick');
 joy.addEventListener('touchmove',e=>{let r=joy.getBoundingClientRect();let dx=e.touches[0].clientX-(r.left+57);let dy=e.touches[0].clientY-(r.top+57);let d=Math.min(55,Math.hypot(dx,dy));let a=Math.atan2(dy,dx);jx=Math.cos(a)*d/55;jy=Math.sin(a)*d/55;stick.style.left=32+Math.cos(a)*d+'px';stick.style.top=32+Math.sin(a)*d+'px';});
 joy.addEventListener('touchend',()=>{jx=0;jy=0;stick.style.left='32px';stick.style.top='32px';});
 document.getElementById('jmp').addEventListener('touchstart',doJump);
 document.getElementById('fire').addEventListener('touchstart',()=>{let k=document.getElementById('kill');let d=document.createElement('div');d.innerText='SHAN killed Enemy';k.appendChild(d);setTimeout(()=>d.remove(),2000);});
}
function animate(){
 requestAnimationFrame(animate);if(!scene)return;
 if(state=='plane'){plane.position.z-=1.5;camera.position.lerp(new THREE.Vector3(plane.position.x,plane.position.y+15,plane.position.z+30),0.1);camera.lookAt(plane.position);if(plane.position.z<-400)doJump();}
 else if(state=='fall'){player.position.y-=1.3;player.position.x+=jx*1.2;player.position.z+=jy*1.2;if(player.position.y<=0.7){player.position.y=0.7;state='ground';document.getElementById('center').innerText='Ocean Palace - Loot Found';}camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+6,player.position.z+13),0.1);camera.lookAt(player.position);}
 else{player.position.x+=jx*0.6;player.position.z+=jy*0.6;camera.position.lerp(new THREE.Vector3(player.position.x,player.position.y+5,player.position.z+11),0.1);camera.lookAt(player.position);}
 renderer.render(scene,camera);
}
</script></body></html>
