<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,
initial-scale=1.0">
<title>BIG FINAL CODE</title>
<style>
*{margin:0;padding:0;
box-sizing:border-box}
body{
background:#000;
color:#fff;
overflow:hidden;
font-family:Arial}
#gameWrap{
position:relative;
width:100vw;
height:100vh;
overflow:hidden}
#map{
position:absolute;
width:8000px;
height:8000px;
background:#1e3d1e;
border:5px solid yellow;
left:0;top:0;
transform-origin:0 0}
#player{
position:absolute;
width:32px;
height:32px;
background:red;
border-radius:50%;
border:3px solid yellow;
left:4000px;
top:4000px;
z-index:30}
.bot{
position:absolute;
width:26px;
height:26px;
background:orange;
border-radius:50%;
border:2px solid white;
z-index:10}
.tower{
position:absolute;
width:70px;
height:90px;
background:blue;
border:2px solid white;
border-radius:10px;
display:flex;
align-items:center;
justify-content:center;
flex-direction:column;
font-size:10px;
z-index:12}
#blue{
position:absolute;
width:7000px;
height:7000px;
left:500px;
top:500px;
border:4px solid cyan;
border-radius:50%;
background:rgba(0,255,255,0.06);
transition:all 3s;
z-index:5}
#red{
position:absolute;
width:1000px;
height:1000px;
left:3000px;
top:3000px;
border:4px solid red;
border-radius:50%;
background:rgba(255,0,0,0.2);
z-index:6}
#joy{
position:fixed;
bottom:90px;
left:15px;
width:90px;
height:90px;
background:rgba(255,255,255,0.1);
border-radius:50%;
border:2px solid white;
z-index:99}
#stick{
position:absolute;
width:40px;
height:40px;
background:yellow;
border-radius:50%;
left:25px;
top:25px}
.btn{
background:#222;
border:2px solid yellow;
color:yellow;
padding:8px;
border-radius:8px;
font-size:12px;
margin:2px}
#topBar{
position:fixed;
top:5px;
left:5px;
z-index:99;
display:flex;
flex-wrap:wrap}
#royalShop{
position:fixed;
top:50%;
left:50%;
transform:translate(-50%,-50%);
width:300px;
background:#111;
border:3px solid gold;
border-radius:15px;
padding:15px;
z-index:9999;
display:none;
text-align:center}
</style>
</head>
<body>
<div id="gameWrap">
<div id="topBar">
<button class="btn"
onclick="zoomIn()">
ZOOM +</button>
<button class="btn"
onclick="zoomOut()">
ZOOM -</button>
<button class="btn"
onclick="doRevive()">
REVIVE</button>
<button class="btn"
onclick="checkCM()">
CM PASS</button>
<button class="btn"
onclick="openShop()"
style="background:gold;
color:black">
ROYAL 500</button>
</div>
<div id="map">
<div id="red"></div>
<div id="blue"></div>
<div id="player"></div>
</div>
<div id="joy">
<div id="stick"></div>
</div>
<div id="royalShop">
<h2 style="color:gold">
CM ROYAL PASS
</h2>
<p>500 Rupay</p>
<div style="background:#222;
padding:10px;
border-radius:10px;
font-size:12px;
text-align:left;
margin-top:10px">
JazzCash: 0300-XXXX<br>
Easypaisa: 0345-XXXX<br>
Bank: Meezan Bank<br>
IBAN: PK00 XXXX XXXX<br>
SWIFT: MEZNPKKA<br>
Title: Syed Shan Ali
</div>
<input id="trxid"
placeholder="Trx ID Likhen"
style="width:100%;
padding:10px;
margin-top:10px;
background:#000;
color:#fff;
border:1px solid gold;
border-radius:8px">
<button onclick="buyPass()"
style="width:100%;
margin-top:10px;
padding:10px;
background:gold;
color:black;
border:none;
border-radius:8px;
font-weight:bold">
ACTIVE KARO
</button>
<button onclick="closeShop()"
style="margin-top:8px;
background:none;
color:white;
border:none">
Band Karen
</button>
</div>
</div>
<script>
let map=document
.getElementById('map');
let pl=document
.getElementById('player');
let blue=document
.getElementById('blue');
let px=4000;
let py=4000;
let zoom=1;
let bw=7000;
// 5 TOWER
for(let i=0;i<5;i++){
let t=document
.createElement('div');
t.className='tower';
t.style.left=
(600+i*1300)+'px';
t.style.top=
(600+i*1100)+'px';
t.innerHTML='TOWER';
map.appendChild(t);
}
// 80 FAST BOTS
for(let i=0;i<80;i++){
let b=document
.createElement('div');
b.className='bot';
b.style.left=
(Math.random()*7000+400)+'px';
b.style.top=
(Math.random()*7000+400)+'px';
map.appendChild(b);
setInterval(()=>{
b.style.left=
(parseInt(b.style.left)+
(Math.random()*80-40))+'px';
b.style.top=
(parseInt(b.style.top)+
(Math.random()*80-40))+'px';
},350);
}
// BLUE ZONE
setInterval(()=>{
if(bw>500){
bw-=100;
blue.style.width=bw+'px';
blue.style.height=bw+'px';
blue.style.left=
(4000-bw/2)+'px';
blue.style.top=
(4000-bw/2)+'px';
}
},3000);
function zoomIn(){
zoom+=0.2;
map.style.transform=
'scale('+zoom+')';
}
function zoomOut(){
zoom-=0.2;
if(zoom<0.4) zoom=0.4;
map.style.transform=
'scale('+zoom+')';
}
function doRevive(){
alert('REVIVE HO GAYA!');
}
let cmPass="CM786";
function checkCM(){
let p=prompt("CM PASS:");
if(p==cmPass){
alert("ADMIN OK!");
}else{
alert("GALAT PASS!");
}
}
function openShop(){
document.getElementById
('royalShop').style.display='block';
}
function closeShop(){
document.getElementById
('royalShop').style.display='none';
}
function buyPass(){
let trx=document
.getElementById('trxid').value;
if(trx.length<5){
alert("Trx ID likhen!");
return;
}
localStorage.setItem
("cmRoyalPass","PAID");
alert("PASS ACTIVE: "+trx);
closeShop();
}
// JOYSTICK 200-260
let drag=false;
let joy=document
.getElementById('joy');
let stick=document
.getElementById('stick');
joy.addEventListener
('touchstart',()=>{
drag=true;
});
joy.addEventListener
('touchend',()=>{
drag=false;
stick.style.left='25px';
stick.style.top='25px';
});
joy.addEventListener
('touchmove',(e)=>{
if(!drag) return;
let rc=joy
.getBoundingClientRect();
let x=e.touches[0].clientX
-rc.left-45;
let y=e.touches[0].clientY
-rc.top-45;
let dist=Math.sqrt
(x*x+y*y);
if(dist>35){
x=x/dist*35;
y=y/dist*35;
}
stick.style.left=
(25+x)+'px';
stick.style.top=
(25+y)+'px';
px+=x*0.7;
py+=y*0.7;
map.style.left=
(-px*zoom+160)+'px';
map.style.top=
(-py*zoom+250)+'px';
pl.style.left=px+'px';
pl.style.top=py+'px';
});
console.log("BIG 211+ CODE LOADED");
</script>
</body>
</html>
